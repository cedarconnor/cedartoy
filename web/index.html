<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CedarToy - Shader Renderer</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <!-- CodeMirror for shader editing -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>🌲 CedarToy</h1>
            <nav>
                <a href="https://github.com/yourusername/cedartoy" target="_blank">GitHub</a>
                <a href="/docs/USER_GUIDE.md" target="_blank">Docs</a>
            </nav>
        </header>

        <stage-rail></stage-rail>

        <main class="app-main">
            <aside class="shader-browser-panel">
                <shader-browser></shader-browser>
            </aside>

            <section class="config-editor-panel">
                <div id="stage-panels">
                    <div data-stage="project">
                        <stage-helper
                            title="Stage 1 · Project"
                            subtitle="Load a folder produced by MusiCue's Send to CedarToy. CedarToy reads the bundle, links audio, and shows you what's inside before you commit to a render."></stage-helper>
                        <project-panel></project-panel>
                    </div>
                    <div data-stage="shader" hidden>
                        <stage-helper
                            title="Stage 2 · Shader"
                            subtitle="Pick a shader from the rail. Make this shader reactive ▸ copies a Claude-ready prompt; paste Claude's reply into the drawer below and hit Apply."></stage-helper>
                        <config-editor></config-editor>
                        <shader-reactivity-drawer></shader-reactivity-drawer>
                    </div>
                    <div data-stage="output" hidden>
                        <stage-helper
                            title="Stage 3 · Output"
                            subtitle="Pick a preset, set duration, glance at the estimate. The estimate sharpens after each real render of this shader."></stage-helper>
                        <output-panel></output-panel>
                    </div>
                    <div data-stage="render" hidden>
                        <stage-helper
                            title="Stage 4 · Render"
                            subtitle="Start Render below. Progress streams over WebSocket; completed renders list every emitted frame."></stage-helper>
                        <div style="padding: 16px; color: #aaa;">
                            Use the Render panel at the bottom of the page to start your render.
                        </div>
                    </div>
                </div>
            </section>

            <section class="preview-panel-wrapper">
                <preview-panel></preview-panel>
                <transport-strip></transport-strip>
                <cue-scrubber></cue-scrubber>
            </section>
        </main>

        <footer class="render-panel-wrapper">
            <render-panel></render-panel>
        </footer>
    </div>

    <!-- Hidden components -->
    <directory-browser></directory-browser>
    <shader-editor></shader-editor>

    <!-- CodeMirror -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>

    <!-- App Scripts -->
    <script type="module" src="/js/app.js?v=12"></script>
</body>
</html>
